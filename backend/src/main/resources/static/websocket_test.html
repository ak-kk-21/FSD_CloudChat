<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test Client</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .message { margin: 5px 0; }
        .join { color: green; font-style: italic; }
        .typing { color: gray; font-style: italic; }
        .chat { color: blue; }
        input, button { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <h2>WebSocket Test Client</h2>
    
    <div>
        <input type="text" id="userId" placeholder="User ID" value="test-user-123">
        <input type="text" id="userName" placeholder="User Name" value="TestUser">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()" disabled id="disconnectBtn">Disconnect</button>
    </div>
    
    <div style="margin-top: 10px;">
        <input type="text" id="channelId" placeholder="Channel ID" value="test-channel-123">
        <input type="text" id="messageInput" placeholder="Type message...">
        <button onclick="sendMessage()" disabled id="sendBtn">Send</button>
    </div>
    
    <h3>Messages:</h3>
    <div id="messages"></div>
    
    <script>
        var stompClient = null;
        
        function connect() {
            var socket = new SockJS('http://localhost:8080/ws');
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function(frame) {
                console.log('Connected: ' + frame);
                
                // Subscribe to public topic
                stompClient.subscribe('/topic/public', function(message) {
                    showMessage(JSON.parse(message.body));
                });
                
                // Announce user joined
                var joinMessage = {
                    channelId: document.getElementById('channelId').value,
                    senderId: document.getElementById('userId').value,
                    senderName: document.getElementById('userName').value,
                    type: 'JOIN'
                };
                stompClient.send("/app/chat.addUser", {}, JSON.stringify(joinMessage));
                
                // Update UI
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            });
        }
        
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        }
        
        function sendMessage() {
            var message = {
                id: null,
                channelId: document.getElementById('channelId').value,
                senderId: document.getElementById('userId').value,
                senderName: document.getElementById('userName').value,
                content: document.getElementById('messageInput').value,
                timestamp: null,
                type: 'CHAT'
            };
            stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(message));
            document.getElementById('messageInput').value = '';
        }
        
        function showMessage(message) {
            var messagesDiv = document.getElementById('messages');
            var messageElement = document.createElement('div');
            
            var className = '';
            if (message.type === 'JOIN') className = 'join';
            else if (message.type === 'TYPING') className = 'typing';
            else className = 'chat';
            
            messageElement.className = 'message ' + className;
            
            if (message.type === 'JOIN') {
                messageElement.textContent = message.content;
            } else if (message.type === 'TYPING') {
                messageElement.textContent = message.senderName + ' is typing...';
                setTimeout(function() { messageElement.remove(); }, 1000);
            } else {
                messageElement.textContent = message.senderName + ': ' + message.content;
            }
            
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Typing indicator
        var typingTimeout;
        document.getElementById('messageInput').addEventListener('input', function() {
            if (!stompClient) return;
            
            var typingMessage = {
                channelId: document.getElementById('channelId').value,
                senderId: document.getElementById('userId').value,
                senderName: document.getElementById('userName').value,
                type: 'TYPING'
            };
            stompClient.send("/app/chat.typing", {}, JSON.stringify(typingMessage));
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(function() {}, 1000);
        });
    </script>
</body>
</html>
