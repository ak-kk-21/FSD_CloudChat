<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudChat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="mesh-gradient-bg">
        <div class="mesh-ball" style="width: 600px; height: 600px; background: var(--accent-primary); top: -200px; right: -200px; opacity: 0.1;"></div>
        <div class="mesh-ball" style="width: 400px; height: 400px; background: var(--accent-secondary); bottom: -100px; left: -100px; opacity: 0.1;"></div>
    </div>

    <div class="app-container">
        <!-- Server Sidebar -->
        <div class="servers-sidebar">
                <div class="server-actions" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                    <button id="add-server-btn" class="icon-btn action-circle" title="Create Server" onclick="showServerModal()">+</button>
                    <button id="discover-servers-btn" class="icon-btn action-circle" title="Discover Servers" onclick="handleDiscoverServers()">🌐</button>
                    <button id="join-invite-btn" class="icon-btn action-circle" title="Join with Invite Code" onclick="showJoinInviteModal()">🔗</button>
                </div>
            <div id="servers-list" class="servers-list">
                <!-- Servers will be dynamically added here -->
            </div>
        </div>
        
        <!-- Channel Sidebar -->
        <div class="channels-sidebar">
            <div class="channels-header">
                <div id="current-server-name-container">
                    <h3 id="current-server-name-text">Select a server</h3>
                </div>
                <div class="header-actions">
                    <button id="add-channel-btn" class="icon-btn" style="display: none;" onclick="showChannelModal()">+</button>
                    <button id="leave-server-btn" class="leave-btn" style="display: none;" onclick="handleLeaveServer()">Leave</button>
                </div>
            </div>
            <div id="channels-list" class="channels-list">
                <!-- Channels will be dynamically added here -->
            </div>
            <div class="user-info">
                <span id="current-username"></span>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chat-header" class="chat-header">
                <div class="chat-header-title">
                    <h3 id="current-channel-name">Select a channel</h3>
                </div>
                <!-- Prominent Invite Display -->
                <div id="server-invite-code-display" style="display: none;"></div>
            </div>
            <div id="messages-container" class="messages-container">
                <!-- Messages will be dynamically added here -->
            </div>
            <div class="message-input-container">
                <textarea id="message-input" placeholder="Type a message..." rows="2"></textarea>
                <button id="send-btn" disabled>Send</button>
            </div>
            <div id="typing-indicator" class="typing-indicator"></div>
        </div>
    </div>
    
    <!-- Modals -->
    <div id="server-modal" class="modal">
        <div class="modal-content">
            <h3>Create New Server</h3>
            <input type="text" id="server-name" placeholder="Server Name">
            
            <label style="display: flex; align-items: center; gap: 8px; color: #fff; font-size: 14px; margin-top: 8px;">
                <input type="checkbox" id="server-is-private" style="width: auto;">
                Make this Server Private (Hidden from Discover)
            </label>

            <div id="server-create-success" style="display: none; padding: 16px; background: rgba(91, 78, 255, 0.15); border: 1px solid var(--accent-primary); border-radius: var(--radius-md); text-align: center; margin-top: 10px;">
                <p style="margin-bottom: 12px; color: #fff; font-size: 14px;">Server created! Share this code with friends:</p>
                <div class="code-box" onclick="copyInviteToClipboard()">
                    <code id="new-server-invite-code" style="font-size: 22px; font-weight: bold; color: var(--accent-primary); font-family: monospace;"></code>
                    <span class="copy-icon" style="font-size: 18px;">📋</span>
                </div>
                <p style="margin-top: 10px; font-size: 11px; color: var(--text-dim);">(Click code to copy)</p>
            </div>

            <button id="create-server-btn" onclick="handleCreateServer()">Create</button>
            <button onclick="closeModal('server-modal')">Close</button>
        </div>
    </div>
    
    <div id="channel-modal" class="modal">
        <div class="modal-content">
            <h3>Create New Channel</h3>
            <input type="text" id="channel-name" placeholder="Channel Name">
            <select id="channel-type">
                <option value="text">Text Channel</option>
                <option value="voice">Voice Channel</option>
            </select>
            <button onclick="handleCreateChannel()">Create</button>
            <button onclick="closeModal('channel-modal')">Cancel</button>
        </div>
    </div>
    
    <div id="discover-modal" class="modal">
        <div class="modal-content discover-content">
            <h3>Discover Public Servers</h3>
            <div id="public-servers-list" class="public-servers-list">
                <!-- Public servers will be dynamically added here -->
            </div>
            <button onclick="closeModal('discover-modal')">Close</button>
        </div>
    </div>
    
    <div id="join-invite-modal" class="modal">
        <div class="modal-content">
            <h3>Join Server via Invite</h3>
            <p style="color: var(--text-dim); margin-bottom: 8px;">Enter the invite code provided by the server owner.</p>
            <input type="text" id="invite-code-input" placeholder="e.g. X9k2mP8a">
            <button onclick="handleJoinViaInvite()">Join Server</button>
            <button onclick="closeModal('join-invite-modal')">Cancel</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
