<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudChat - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="mesh-gradient-bg">
        <div class="mesh-ball" style="width: 400px; height: 400px; background: var(--accent-primary); top: -100px; left: -100px;"></div>
        <div class="mesh-ball" style="width: 500px; height: 500px; background: var(--accent-secondary); bottom: -150px; right: -150px;"></div>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <h1>CloudChat</h1>
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('register')">Register</button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Unlock Access</button>
                <div id="login-error" class="error-message"></div>
            </form>
            
            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <input type="text" id="register-username" placeholder="Username" required>
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Create Identity</button>
                <div id="register-error" class="error-message"></div>
            </form>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }
    </script>
</body>
</html>
